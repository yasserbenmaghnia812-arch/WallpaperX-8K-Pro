name: DevDroid AI Debug Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Verify and setup Gradle
        id: verify
        run: |
          # Gradle プロジェクトかどうか判定 (build.gradle* の存在で確認)
          GRADLE_FILE=$(find . -maxdepth 2 -name "build.gradle*" | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::build.gradle が見つかりません。Gradle プロジェクトではないためビルドをスキップします。"
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Found: $GRADLE_FILE"

          # gradlew がある場合はそのまま使う
          if [ -f gradlew ]; then
            chmod +x gradlew
            exit 0
          fi

          # gradle-wrapper.properties がある場合はそのバージョンで生成
          PROPS=$(find . -name "gradle-wrapper.properties" -path "*/gradle/wrapper/*" | head -1)
          if [ -n "$PROPS" ]; then
            GRADLE_VER=$(grep distributionUrl "$PROPS" | sed 's|.*gradle-||;s|-.*||')
            echo "Generating wrapper from properties (Gradle $GRADLE_VER)..."
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-${GRADLE_VER}/bin/gradle wrapper
            chmod +x gradlew
            exit 0
          fi

          # wrapper 非同梱: 対象 repo の AGP バージョンを検出し、互換 Gradle を選ぶ。
          # 固定値を追いかけない (AI Studio は今 AGP 9、いずれ 10)。AGP major ⟺ Gradle major の
          # 安定した関係で、major を検出して最近の互換 Gradle を選ぶ = 一度で将来分も受ける。
          # AGP-Gradle 互換 (Android 公式): AGP 8.x=Gradle 8.x / AGP 9.x=Gradle 9.x (AGP 9.2→Gradle 9.4.1)。
          AGP_VER=""
          # (1) plugins DSL / buildscript classpath の直書き:
          #     id("com.android.application") version "X.Y.Z" / com.android.tools.build:gradle:X.Y.Z
          AGP_VER=$(grep -rhoE 'com\.android\.(application|library|tools\.build:gradle)[^0-9]*[0-9]+\.[0-9]+(\.[0-9]+)?' . 2>/dev/null | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          # (2) version catalog (AI Studio の標準): libs.versions.toml の
          #     com.android.application プラグインの version.ref を解決 → [versions] の値。
          if [ -z "$AGP_VER" ]; then
            TOML=$(find . -name libs.versions.toml | head -1)
            if [ -n "$TOML" ]; then
              REF=$(grep -E 'com\.android\.application' "$TOML" | grep -oE 'version\.ref *= *"[^"]+"' | grep -oE '"[^"]+"' | tr -d '"' | head -1)
              if [ -n "$REF" ]; then
                AGP_VER=$(grep -E "^ *$REF *=" "$TOML" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
              fi
              # ref 解決に失敗したら慣用キー (agp / androidGradlePlugin) を直引き。
              if [ -z "$AGP_VER" ]; then
                AGP_VER=$(grep -iE '^ *(agp|androidGradlePlugin|android-gradle-plugin) *=' "$TOML" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
              fi
            fi
          fi
          AGP_MAJOR=$(echo "$AGP_VER" | cut -d. -f1)
          # AGP major → 互換 Gradle (表は 1 箇所。将来 AGP 10 は 1 行足すだけ)。
          case "$AGP_MAJOR" in
            8) GRADLE_VER="8.14.3" ;;
            9) GRADLE_VER="9.4.1" ;;
            # フォールバック (AGP 未検出 / 未知 major): 最新寄りの Gradle に賭け、silent に古い版で
            # version-check を再生産しない。読めなかった事実は warning で残す (non-silent)。
            *) GRADLE_VER="9.4.1"; echo "::warning::AGP バージョンを検出できませんでした (detected='$AGP_VER')。最新の Gradle $GRADLE_VER で wrapper を生成します。対象が古い AGP の場合はビルドが失敗し得ます (その場合は repo に gradle wrapper を同梱してください)。" ;;
          esac
          echo "AGP=$AGP_VER (major=$AGP_MAJOR) 検出 → Gradle $GRADLE_VER で wrapper を生成します"
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VER}/bin/gradle wrapper
          chmod +x gradlew

      # DevDroidAI 管理の共有 debug keystore を ~/.android/debug.keystore に配置する。
      # CI runner は毎回 fresh のため default だと毎 build で異なる debug 署名鍵が
      # 生成され、user 端末で「パッケージが競合 (= 同 applicationId だが別 signature)」
      # エラーが頻発していた。AGP debug build は ~/.android/debug.keystore が存在すれば
      # それを default で使うため、target repo の build.gradle.kts は変更不要。
      # debug 用かつ public 配布想定なので keystore base64 は inline 同梱 (storepass / keypass
      # は AGP 標準の "android")。release / production 署名には**使わない**。
      # SHA256 fingerprint: 20:6B:C8:AB:F7:48:CE:E3:0B:AB:09:9F:9E:49:5C:A5:45:F2:16:0A:91:DA:02:A0:B0:78:5F:AC:E0:ED:0D:96
      #
      # 配置は 2 箇所:
      #  (1) ~/.android/debug.keystore … AGP 既定の debug 署名が参照 (signingConfig 明示なしの repo)。
      #  (2) ${rootDir}/debug.keystore … AI Studio export は独自 debugConfig で
      #      storeFile = file("${rootDir}/debug.keystore") を明示するのが常道 (storepass/keyalias/
      #      keypass は標準の "android"/"androiddebugkey")。この場合 (1) は使われず repo ルートの
      #      debug.keystore が要る。zip は同梱しない (摩擦2) ので provision がここに置いて吸収する。
      #      (BK3 入口B device E2E で simple-counter が validateSigningDebug で落ちて判明)。
      #  未参照の repo では (2) は使われない無害なファイル。両置きで default/明示の双方をカバー。
      - name: Set up shared debug keystore (DevDroidAI managed)
        if: steps.verify.outputs.skip != 'true'
        run: |
          mkdir -p $HOME/.android
          echo "" | base64 -d > $HOME/.android/debug.keystore
          # AGP は XDG パス (~/.config/.android) を debug keystore の既定に使うため、置いた共有
          # keystore (~/.android) が無視され毎ビルド ランダム署名 → user 端末で「パッケージ競合」に
          # なる。ANDROID_USER_HOME を ~/.android に固定し (AGP 探索の最優先)、後続 step へ
          # $GITHUB_ENV で伝播させて共有 keystore を確実に使わせる (全ビルド署名一致=競合根絶)。
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          # AI Studio export の独自 debugConfig (storeFile = file("${rootDir}/debug.keystore")) 対応:
          # 同じ共有 keystore を repo ルート (= ${rootDir}) にも置く。未参照 repo では無害。
          cp $HOME/.android/debug.keystore "$GITHUB_WORKSPACE/debug.keystore"

      - name: Build Debug APK
        id: build
        if: steps.verify.outputs.skip != 'true'
        run: ./gradlew assembleDebug

      - name: Find APK
        id: find_apk
        if: steps.build.outcome == 'success'
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      # Firebase 配布 (secrets が設定されている場合のみ)
      - name: Upload to Firebase App Distribution
        id: distribute
        if: success() && steps.find_apk.outputs.apk_path != ''
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        env:
          FIREBASE_APP_ID_CHECK: ${{ secrets.FIREBASE_APP_ID }}
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: ${{ steps.find_apk.outputs.apk_path }}
          releaseNotes: "自動ビルド - ${{ github.sha }}"

      # GitHub Releases に APK を公開 (push / PR どちらでもテスト用に公開)
      - name: Create Release with APK
        id: release
        if: success() && steps.find_apk.outputs.apk_path != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ github.event_name == 'pull_request' && format('PR #{0} Test Build', github.event.pull_request.number) || format('Debug Build #{0}', github.run_number) }}"
          body: "${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('自動ビルド ({0})', github.sha) }}"
          files: ${{ steps.find_apk.outputs.apk_path }}
          prerelease: ${{ github.event_name == 'pull_request' }}
          make_latest: ${{ github.event_name != 'pull_request' }}

      # 古い Release を自動削除 (最新5件のみ保持)
      # 今回作成した Release (tag_name) を確実に除外してから古いものを削除
      - name: Cleanup old releases
        if: success() && steps.release.outcome == 'success'
        run: |
          CURRENT_TAG="build-${{ github.run_number }}"
          curl -sS -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r --arg tag "$CURRENT_TAG" '.[] | select(.tag_name != $tag) | .id' \
            | tail -n +5 \
            | while read ID; do
                echo "Deleting release $ID..."
                curl -sS -X DELETE -H "Authorization: token ${{ github.token }}" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/$ID"
              done
        continue-on-error: true

      # DevDroid Worker にビルド結果を通知 (成功・失敗・スキップ)
      # v1.0.30 Phase B: || true 撤廃 → warn-only annotation。curl 失敗を ::warning::
      # で可視化しつつ、build status (=ビルド自体の成否) は維持する設計。
      # 通知失敗 → exit 1 だと「build 成功しているのに workflow 失敗表示」UX 退化が
      # 起きるため、warn のみで済ませる (judgment 8)。
      - name: Notify DevDroid Worker
        if: always() && steps.verify.outputs.skip != 'true'
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            CONCLUSION="success"
            FIREBASE_URL="${{ steps.distribute.outputs.TESTING_URI }}"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}"
            INSTALL_URL="${FIREBASE_URL:-$RELEASE_URL}"
          else
            CONCLUSION="failure"
            INSTALL_URL=""
          fi
          PR_NUM="${{ github.event.pull_request.number || 0 }}"
          BRANCH="${{ github.head_ref || '' }}"
          HTTP_CODE=$(curl -sS -o /tmp/curl_response.txt -w "%{http_code}" -X POST \
            "https://devdroidai.love-riko1.workers.dev/build-result" \
            -H "Content-Type: application/json" \
            -d "{\"repo\": \"WallpaperX-8K-Pro\", \"runId\": ${{ github.run_id }}, \"conclusion\": \"$CONCLUSION\", \"installUrl\": \"$INSTALL_URL\", \"prNumber\": $PR_NUM, \"branch\": \"$BRANCH\"}")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::DevDroid Worker notification failed: HTTP $HTTP_CODE"
            cat /tmp/curl_response.txt || true
            # exit 1 はしない (build status を維持、judgment 8)
          fi

      # PR4.7-B: APK を DevDroid 管理の R2 に保存 (/apk-upload)。/build-result の
      # 後に実行し、成功すれば task.apk が source:"r2" に上書きされる。失敗時は
      # GitHub Release / Firebase fallback が残る (continue-on-error)。
      - name: Upload APK to DevDroid R2
        if: success() && steps.build.outcome == 'success' && steps.find_apk.outputs.apk_path != ''
        continue-on-error: true
        run: |
          BRANCH_ENC=$(jq -rn --arg b "${{ github.head_ref || '' }}" '$b|@uri')
          HTTP_CODE=$(curl -sS -o /tmp/apk_upload_response.txt -w "%{http_code}" -X POST \
            "https://devdroidai.love-riko1.workers.dev/apk-upload?repo=WallpaperX-8K-Pro&runId=${{ github.run_id }}&branch=$BRANCH_ENC" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${{ steps.find_apk.outputs.apk_path }}")
          echo "apk-upload HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::APK upload to R2 failed: HTTP $HTTP_CODE"
            cat /tmp/apk_upload_response.txt || true
          fi
